name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dashboard:
    name: Lint, testes e build do dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Nao-bloqueante por enquanto: o codigo tem 48 erros de lint
      # pre-existentes (unused vars, exhaustive-deps...). Quando a base
      # for limpa, remover o continue-on-error para tornar o lint gate.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Testes
        run: npm test

      - name: Build (typecheck + vite)
        run: npm run build
